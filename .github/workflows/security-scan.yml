name: AIShield Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 自扫描：本仓库用自己的扫描器扫自己。pin 到 main（而不是某个 v 标签）
      # 是为了让扫描器随仓库同步演进——否则每次发版都得额外打标签才能更新扫描器。
      #
      # 2026-09-25 修复：原先 pin 在 v4.3.0，且传了该版本 action.yml 里根本不存在的
      # include_trust_attestation / output_format 两个 input（GitHub 直接告警
      # "Unexpected input(s)"），action 忽略它们后就没产出 SARIF，导致下一步
      # upload-sarif 报 "Path does not exist: aishield-results.sarif"。
      # action.yml 声明的 input 只有：source_url / tool_type / name / enable_osv / fail_on。
      #
      # 这一步**只负责产出 SARIF / JSON 制品供 GitHub Security tab 展示，不承担门禁**。
      # 原因见下面 "Gate on self-scan"：本仓库扫自己时，agent-card.json / docs/ /
      # registry/ / distribution/ 里全是扫描器自己的检测词表与演示载荷，
      # fail_on: high 必然触发（实测 score=25 risk=critical，50 条 finding 里 19 条
      # high/critical 全落在自家 manifest 与文档上），那是自指噪音不是真实信号。
      # fail_on 没有 "关闭" 档位（RISK_ORDER 里 info 也 = 1，safe 意味着 info 就失败），
      # 所以用 continue-on-error 把它降级为制品步骤。
      - name: Run AIShield Security Scan
        id: aishield
        uses: lm203688/aishield@main
        continue-on-error: true
        with:
          source_url: ${{ github.server_url }}/${{ github.repository }}
          tool_type: mcp
          name: ${{ github.event.repository.name }}
          enable_osv: false
          fail_on: high

      # action_entrypoint.py 实际落盘的文件名是 aishield.sarif / aishield-report.json，
      # 不是 aishield-results.sarif / aishield-results.json（原 workflow 写错了，
      # 导致 SARIF 上传硬失败、分数门禁与 PR 评论都静默空转）。
      - name: Show scan artifacts
        if: always()
        run: |
          echo "=== produced files ==="
          ls -la aishield.sarif aishield-report.json 2>&1 || true
          echo "=== action outputs ==="
          echo "score=${{ steps.aishield.outputs.score }}"
          echo "risk_level=${{ steps.aishield.outputs.risk_level }}"
          echo "sarif=${{ steps.aishield.outputs.sarif }}"

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('aishield.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: aishield.sarif

      # 真正的门禁：scripts/ci_self_scan_gate.py
      #
      # 它跑 scripts/self_scan.py（仓库自有的自扫描入口），用
      # distribution/self_reference_allowlist.json 把扫描器自指误报
      # （检测器词汇 / 演示载荷 / 只读 preflight）标注为 self_reference 后不再阻断，
      # 然后把结论折成一个带 0-100 分数的报告 self-scan-summary.json。
      #
      # 为什么多这一层：self_scan.py 只输出发现清单（totals / sources /
      # stale_allowlist_entries），没有总分。门禁要"跟阈值比"就必须有分数，
      # 而分数必须来自真实计算——否则就是 2026-08-05 那次事故的翻版
      # （门禁读 d.get('score', 0)，响应里没有 score 键，恒得 0 分连红 17 次，
      # 而被守护对象其实是健康的）。分数口径与阈值见脚本内 WORKFLOW_THRESHOLD。
      #
      # 退出码契约（三档都让 CI 红，语义不同）：
      #   0 = 干净：无未登记的阻断级发现，且 allowlist 没有腐烂
      #   1 = 真实信号：存在未登记的阻断级发现，必须处理
      #   2 = 门禁失效：allowlist 条目已腐烂（不再匹配任何实际发现），
      #       说明自指误报的豁免清单过期了，等于自扫描在静默放行
      #
      # 下面这段内联 Python 只读 score / overall_score 两个键——都是
      # self-scan-summary.json 里真实存在的键（顶层键严格限定为
      # score / overall_score / risk_level / badge_level / report，
      # 其余明细全部塞进 report）。tests/test_ci_contract.py 会校验这一点。
      - name: Gate on self-scan
        shell: bash
        run: |
          # 零第三方依赖：self_scan.py 只走 stdlib + scanner.* + verify_distribution.py，
          # 唯一可能用到的 PyYAML 在 scanner/policy.py 里是 try/except 包裹、
          # 缺了会降级到内置 _mini_yaml，所以这里不装任何包。
          python scripts/ci_self_scan_gate.py
          rc=$?

          python - <<'PY'
          import json
          import sys

          with open("self-scan-summary.json", encoding="utf-8") as fh:
              d = json.load(fh)
          # 带 fallback 的读法：score 缺失时退回 overall_score，两者都缺才记 0。
          # 这是 2026-08-05 事故后的标准写法——两个键都在报告里真实存在。
          score = d.get("score", d.get("overall_score", 0))
          print("AIShield self-scan gate score: %s / 100" % score)
          if score < 60:
              print("FAIL: score below threshold 60")
              sys.exit(1)
          PY
          gate_rc=$?

          if [ "$rc" -ne 0 ]; then
            echo "::error::self-scan 退出码 $rc（1=存在未登记阻断级发现，2=allowlist 已腐烂）"
            exit "$rc"
          fi
          if [ "$gate_rc" -ne 0 ]; then
            echo "::error::AIShield self-scan 分数低于阈值 60"
            exit "$gate_rc"
          fi
          echo "::notice::AIShield self-scan 通过（分数 >= 60，无未登记阻断级发现）"

      - name: Upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-scan-report
          path: |
            self-scan-summary.json
            self-scan-comment.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            // 评论内容由 scripts/ci_self_scan_gate.py 生成并落到 self-scan-comment.md。
            // 不在这里做 JSON 取值——取值逻辑在 Python 里好测试，
            // 且 workflow 里的 .get() 键会被 tests/test_ci_contract.py 静态校验。
            const fs = require('fs');
            const file = 'self-scan-comment.md';
            if (!fs.existsSync(file)) {
              core.notice('self-scan-comment.md not produced');
              return;
            }
            const body = fs.readFileSync(file, 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
