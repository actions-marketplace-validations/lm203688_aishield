name: AIShield Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Run AIShield Security Scan
        uses: lm203688/aishield@v4.3.0
        with:
          source_url: ${{ github.server_url }}/${{ github.repository }}
          tool_type: mcp
          name: ${{ github.event.repository.name }}
          enable_osv: false
          fail_on: high
          include_trust_attestation: true
          output_format: sarif
      
      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aishield-results.sarif
      
      - name: Gate on security score
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          p = 'aishield-results.json'
          if not os.path.exists(p):
              print('no aishield-results.json — skip score gate')
              sys.exit(0)
          with open(p) as fh:
              d = json.load(fh)
          score = d.get('score', d.get('overall_score', 0))
          print('security score:', score)
          if score < 60:
              print(f'FAIL: security score {score} < 60')
              sys.exit(1)
          PY

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'aishield-results.json';
            
            if (fs.existsSync(path)) {
              const results = JSON.parse(fs.readFileSync(path, 'utf8'));
              
              let comment = `## 🛡️ AIShield Security Scan Results\n\n`;
              comment += `**Security Score**: ${results.score}/100\n`;
              comment += `**Risk Level**: ${results.risk_level}\n\n`;
              
              if (results.findings && results.findings.length > 0) {
                comment += `### 🔍 Security Findings (${results.findings.length})\n\n`;
                
                results.findings.slice(0, 5).forEach(finding => {
                  comment += `**${finding.severity.toUpperCase()}**: ${finding.rule}\n`;
                  comment += `${finding.description}\n\n`;
                });
                
                if (results.findings.length > 5) {
                  comment += `... and ${results.findings.length - 5} more findings\n\n`;
                }
              } else {
                comment += `✅ No security findings detected!\n\n`;
              }
              
              comment += `### 📊 Full Report\n`;
              comment += `[View detailed SARIF report](https://github.com/${{ github.repository }}/security/analysis)`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }